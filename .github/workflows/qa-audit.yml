name: QA Audit

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static QA audit
        run: python3 scripts/qa_audit.py
