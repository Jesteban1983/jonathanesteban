# ─────────────────────────────────────────────────────────────────────────────
# jonathanesteban.dev — Netlify deploy config
# El sitio es Astro (astro-portfolio/). El build genera dist/ dentro de esa
# carpeta. Netlify debe leer el repo RAIZ y apuntar base a astro-portfolio.
# Añadido 2026-10-15 para resolver el 404 "Page not found" provocado por el
# borrado del antiguo netlify.toml (que apuntaba a site/, ya inexistente).
# ─────────────────────────────────────────────────────────────────────────────

[build]
  base = "astro-portfolio"
  command = "npm ci && npm run build"
  publish = "dist"

# Versión de Node exigida por package.json ("engines": { "node": ">=22.12.0" })
[build.environment]
  NODE_VERSION = "22"

# === HEADERS DE SEGURIDAD Y PRIVACIDAD ===
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # CSP: estilos/scripts propios, fuentes autoalojadas (Inter vía @fontsource), teselas de mapa Esri (img-src),
    # imágenes inline,
    # conexiones a tu propio dominio + Formspree (fallback) + el proxy interno.
    # Ajusta si añades un CDN externo (Google Fonts, etc.) en el futuro.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://server.arcgisonline.com https://services.arcgisonline.com; font-src 'self' data:; connect-src 'self' https://formspree.io https://n8n.jonathanesteban.dev; base-uri 'self'; form-action 'self' https://formspree.io; frame-ancestors 'none'"

# === CACHÉ (rendimiento / Core Web Vitals) ===
# /_astro/* lleva hash en el nombre → inmutable. Assets estáticos: 1 año.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/leaflet/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# === FUNCIONES (Netlify Functions) ===
# Las funciones viven en astro-portfolio/netlify/functions/*.js y Netlify las
# detecta automáticamente — no hace falta ruta en [functions].
# Se sirven en /.netlify/functions/<nombre> tanto en local (netlify dev) como
# en producción.

# === REDIRECCIONES LEGACY (solo para rutas que YA NO existen en el Astro) ===
# /legal/privacidad/ del sitio antiguo → /privacy-policy/ (Astro)
[[redirects]]
  from = "/legal/privacidad/"
  to = "/privacy-policy/"
  status = 301
  force = true

# /servicios/soporte-it/ del sitio antiguo → /servicios/ (índice de servicios)
[[redirects]]
  from = "/servicios/soporte-it/*"
  to = "/servicios/"
  status = 301
  force = true

# Páginas de servicio antiguas → /servicios/ (se reorganizaron los nombres)
[[redirects]]
  from = "/servicios/reparacion-ordenadores-portatiles/*"
  to = "/servicios/"
  status = 301
  force = true

[[redirects]]
  from = "/servicios/formateo-limpieza-optimizacion/*"
  to = "/servicios/"
  status = 301
  force = true

[[redirects]]
  from = "/servicios/mantenimiento-preventivo-pc/*"
  to = "/servicios/mantenimiento-pc/"
  status = 301
  force = true

# Rutas de la etapa anterior eliminadas (Desarrollo Web, Automatización, Proyectos)
[[redirects]]
  from = "/servicios/desarrollo-web/*"
  to = "/servicios/"
  status = 301
  force = true

[[redirects]]
  from = "/servicios/desarrollo-web"
  to = "/servicios/"
  status = 301
  force = true

[[redirects]]
  from = "/servicios/automatizacion/*"
  to = "/servicios/"
  status = 301
  force = true

[[redirects]]
  from = "/servicios/automatizacion"
  to = "/servicios/"
  status = 301
  force = true

[[redirects]]
  from = "/proyectos/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/proyectos"
  to = "/"
  status = 301
  force = true

# Alias sitemap estándar
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
  force = true

# Subdominio Netlify → dominio propio
[[redirects]]
  from = "https://jonathanesteban.netlify.app/*"
  to = "https://jonathanesteban.dev/:splat"
  status = 301