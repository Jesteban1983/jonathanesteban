# ============================================================
# NETLIFY.TOML — Configuración SEO técnico para jonathanesteban
# ============================================================

[build]
  publish = "."
  # Sin command de build, ya que es HTML estático puro

# ------------------------------------------------------------
# HEADERS — Seguridad, caché y rendimiento
# ------------------------------------------------------------

# Headers generales aplicados a todo el sitio
[[headers]]
  for = "/*"
  [headers.values]
    # Seguridad
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://forms.netlify.com;"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Performance
    X-Powered-By = "Netlify"

# Caché de 1 año para assets estáticos
[[headers]]
  for = "/*.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caché específico para imágenes y assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cachear HTML para asegurar que siempre veas la última versión
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No cachear robots.txt ni sitemap.xml
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------
# REDIRECCIONES — Pretty URLs y rutas
# ------------------------------------------------------------

# Redirigir /index.html a / (para no indexar el index.html)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
