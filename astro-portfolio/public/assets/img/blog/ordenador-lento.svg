<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0D3C46"/>
      <stop offset="100%" stop-color="#071a20"/>
    </linearGradient>
    <linearGradient id="monitorScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f1729"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2A72A" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#F2A72A" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0D3C46" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ssdGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2e38"/>
      <stop offset="100%" stop-color="#0D3C46"/>
    </linearGradient>
    <linearGradient id="ramGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2e38"/>
      <stop offset="100%" stop-color="#143038"/>
    </linearGradient>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Ambient glow bottom-right -->
  <circle cx="900" cy="500" r="350" fill="url(#accentGlow)"/>
  <circle cx="300" cy="200" r="200" fill="#F2A72A" opacity="0.03"/>

  <!-- Dot grid pattern -->
  <g fill="#F2A72A" opacity="0.035">
    <circle cx="60" cy="40" r="1.5"/><circle cx="160" cy="40" r="1.5"/><circle cx="260" cy="40" r="1.5"/>
    <circle cx="360" cy="40" r="1.5"/><circle cx="460" cy="40" r="1.5"/><circle cx="560" cy="40" r="1.5"/>
    <circle cx="660" cy="40" r="1.5"/><circle cx="760" cy="40" r="1.5"/><circle cx="860" cy="40" r="1.5"/>
    <circle cx="960" cy="40" r="1.5"/><circle cx="1060" cy="40" r="1.5"/><circle cx="1160" cy="40" r="1.5"/>
    <circle cx="60" cy="130" r="1.5"/><circle cx="160" cy="130" r="1.5"/><circle cx="260" cy="130" r="1.5"/>
    <circle cx="360" cy="130" r="1.5"/><circle cx="460" cy="130" r="1.5"/><circle cx="560" cy="130" r="1.5"/>
    <circle cx="660" cy="130" r="1.5"/><circle cx="760" cy="130" r="1.5"/><circle cx="860" cy="130" r="1.5"/>
    <circle cx="960" cy="130" r="1.5"/><circle cx="1060" cy="130" r="1.5"/><circle cx="1160" cy="130" r="1.5"/>
    <circle cx="60" cy="220" r="1.5"/><circle cx="160" cy="220" r="1.5"/><circle cx="260" cy="220" r="1.5"/>
    <circle cx="360" cy="220" r="1.5"/><circle cx="460" cy="220" r="1.5"/><circle cx="560" cy="220" r="1.5"/>
    <circle cx="660" cy="220" r="1.5"/><circle cx="760" cy="220" r="1.5"/><circle cx="860" cy="220" r="1.5"/>
    <circle cx="960" cy="220" r="1.5"/><circle cx="1060" cy="220" r="1.5"/><circle cx="1160" cy="220" r="1.5"/>
    <circle cx="60" cy="310" r="1.5"/><circle cx="160" cy="310" r="1.5"/><circle cx="260" cy="310" r="1.5"/>
    <circle cx="360" cy="310" r="1.5"/><circle cx="460" cy="310" r="1.5"/><circle cx="560" cy="310" r="1.5"/>
    <circle cx="660" cy="310" r="1.5"/><circle cx="760" cy="310" r="1.5"/><circle cx="860" cy="310" r="1.5"/>
    <circle cx="960" cy="310" r="1.5"/><circle cx="1060" cy="310" r="1.5"/><circle cx="1160" cy="310" r="1.5"/>
    <circle cx="60" cy="400" r="1.5"/><circle cx="160" cy="400" r="1.5"/><circle cx="260" cy="400" r="1.5"/>
    <circle cx="360" cy="400" r="1.5"/><circle cx="460" cy="400" r="1.5"/><circle cx="560" cy="400" r="1.5"/>
    <circle cx="660" cy="400" r="1.5"/><circle cx="760" cy="400" r="1.5"/><circle cx="860" cy="400" r="1.5"/>
    <circle cx="960" cy="400" r="1.5"/><circle cx="1060" cy="400" r="1.5"/><circle cx="1160" cy="400" r="1.5"/>
    <circle cx="60" cy="490" r="1.5"/><circle cx="160" cy="490" r="1.5"/><circle cx="260" cy="490" r="1.5"/>
    <circle cx="360" cy="490" r="1.5"/><circle cx="460" cy="490" r="1.5"/><circle cx="560" cy="490" r="1.5"/>
    <circle cx="660" cy="490" r="1.5"/><circle cx="760" cy="490" r="1.5"/><circle cx="860" cy="490" r="1.5"/>
    <circle cx="960" cy="490" r="1.5"/><circle cx="1060" cy="490" r="1.5"/><circle cx="1160" cy="490" r="1.5"/>
    <circle cx="60" cy="580" r="1.5"/><circle cx="160" cy="580" r="1.5"/><circle cx="260" cy="580" r="1.5"/>
    <circle cx="360" cy="580" r="1.5"/><circle cx="460" cy="580" r="1.5"/><circle cx="560" cy="580" r="1.5"/>
    <circle cx="660" cy="580" r="1.5"/><circle cx="760" cy="580" r="1.5"/><circle cx="860" cy="580" r="1.5"/>
    <circle cx="960" cy="580" r="1.5"/><circle cx="1060" cy="580" r="1.5"/><circle cx="1160" cy="580" r="1.5"/>
  </g>

  <!-- Grid pattern subtle -->
  <g opacity="0.04" stroke="#F2A72A" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="50" y1="0" x2="50" y2="675"/>
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="250" y1="0" x2="250" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="350" y1="0" x2="350" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="550" y1="0" x2="550" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="650" y1="0" x2="650" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="850" y1="0" x2="850" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="950" y1="0" x2="950" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="1150" y1="0" x2="1150" y2="675"/>
  </g>

  <!-- Laptop (main element, open, angled) -->
  <g filter="url(#softShadow)" transform="translate(340, 170) rotate(-3)">
    <!-- Lid -->
    <rect x="0" y="0" width="320" height="220" rx="8" ry="8" fill="#1a1a2e" stroke="#2a2a3f" stroke-width="1.5"/>
    <!-- Screen area -->
    <rect x="16" y="12" width="288" height="196" rx="3" ry="3" fill="#0a0a14"/>
    <!-- Code lines on screen representing speed -->
    <g opacity="0.6">
      <rect x="30" y="30" width="120" height="4" rx="2" fill="#F2A72A"/>
      <rect x="30" y="42" width="160" height="4" rx="2" fill="#e2e2f0" opacity="0.3"/>
      <rect x="30" y="54" width="200" height="4" rx="2" fill="#4ade80" opacity="0.4"/>
      <rect x="30" y="66" width="140" height="4" rx="2" fill="#e2e2f0" opacity="0.3"/>
      <rect x="30" y="78" width="180" height="4" rx="2" fill="#7bd0ff" opacity="0.4"/>
      <rect x="30" y="90" width="100" height="4" rx="2" fill="#e2e2f0" opacity="0.3"/>
      <!-- Speed gauge -->
      <circle cx="220" cy="80" r="28" fill="none" stroke="#1a5a6a" stroke-width="3"/>
      <path d="M 220 106 A 24 24 0 0 1 198 88" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
      <circle cx="220" cy="80" r="4" fill="#4ade80"/>
      <line x1="220" y1="80" x2="220" y2="58" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
      <text x="220" y="120" text-anchor="middle" fill="#e2e2f0" font-family="sans-serif" font-size="8" opacity="0.5">OPTIMIZADO</text>
      <!-- SSD icon -->
      <rect x="32" y="110" width="40" height="6" rx="2" fill="#1a5a6a"/>
      <text x="80" y="115" fill="#e2e2f0" font-family="sans-serif" font-size="6" opacity="0.5">SSD</text>
    </g>
    <!-- Base -->
    <rect x="-30" y="208" width="380" height="22" rx="4" ry="4" fill="#141420" stroke="#2a2a3f" stroke-width="1"/>
    <rect x="-10" y="210" width="340" height="18" rx="2" ry="2" fill="#1a1a2e"/>
    <!-- Keyboard hints -->
    <g opacity="0.5">
      <rect x="0" y="212" width="8" height="4" rx="1" fill="#0D3C46"/>
      <rect x="12" y="212" width="8" height="4" rx="1" fill="#0D3C46"/>
      <rect x="24" y="212" width="8" height="4" rx="1" fill="#0D3C46"/>
      <rect x="40" y="212" width="8" height="4" rx="1" fill="#F2A72A"/>
    </g>
  </g>

  <!-- SSD drive (right side, floating) -->
  <g filter="url(#cardGlow)" transform="translate(720, 240)">
    <rect x="0" y="0" width="130" height="130" rx="12" fill="#141420" stroke="#1a5a6a" stroke-width="1.5"/>
    <rect x="15" y="15" width="100" height="100" rx="8" fill="#0a0a14"/>
    <!-- SSD chip -->
    <rect x="35" y="40" width="60" height="40" rx="3" fill="#0D3C46"/>
    <rect x="42" y="47" width="46" height="26" rx="2" fill="#1a5a6a"/>
    <text x="65" y="63" text-anchor="middle" fill="#e2e2f0" font-family="sans-serif" font-size="7" font-weight="600">SSD</text>
    <!-- Flash chips -->
    <rect x="42" y="85" width="12" height="6" rx="1" fill="#F2A72A" opacity="0.6"/>
    <rect x="58" y="85" width="12" height="6" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="74" y="85" width="12" height="6" rx="1" fill="#F2A72A" opacity="0.3"/>
    <!-- Speed indicator -->
    <text x="65" y="120" text-anchor="middle" fill="#4ade80" font-family="sans-serif" font-size="8">550 MB/s</text>
  </g>

  <!-- RAM module (left side, floating) -->
  <g filter="url(#cardGlow)" transform="translate(180, 380)">
    <rect x="0" y="0" width="110" height="80" rx="8" fill="#141420" stroke="#1a5a6a" stroke-width="1.5"/>
    <rect x="10" y="10" width="90" height="60" rx="4" fill="#0a0a14"/>
    <!-- RAM chips -->
    <rect x="16" y="20" width="16" height="16" rx="2" fill="#0D3C46"/>
    <rect x="38" y="20" width="16" height="16" rx="2" fill="#0D3C46"/>
    <rect x="60" y="20" width="16" height="16" rx="2" fill="#0D3C46"/>
    <rect x="16" y="42" width="16" height="16" rx="2" fill="#1a5a6a"/>
    <rect x="38" y="42" width="16" height="16" rx="2" fill="#1a5a6a"/>
    <rect x="60" y="42" width="16" height="16" rx="2" fill="#1a5a6a"/>
    <!-- Gold pins -->
    <rect x="10" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="18" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="26" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="34" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="42" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="50" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="58" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="66" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="74" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <rect x="82" y="68" width="4" height="8" rx="1" fill="#F2A72A" opacity="0.4"/>
    <text x="55" y="10" text-anchor="middle" fill="#e2e2f0" font-family="sans-serif" font-size="7" opacity="0.6">RAM 16 GB</text>
  </g>

  <!-- Cleaning tool (compressed air can) -->
  <g filter="url(#cardGlow)" transform="translate(760, 400)">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="#141420" stroke="#2a2a3f" stroke-width="1"/>
    <rect x="15" y="8" width="50" height="70" rx="6" fill="#1a5a6a"/>
    <rect x="25" y="14" width="30" height="8" rx="2" fill="#0D3C46"/>
    <text x="40" y="50" text-anchor="middle" fill="#e2e2f0" font-family="sans-serif" font-size="6">AIRE</text>
    <!-- Nozzle -->
    <rect x="35" y="78" width="10" height="12" rx="2" fill="#F2A72A"/>
    <!-- Air puffs -->
    <g opacity="0.3">
      <circle cx="40" cy="96" r="3" fill="#e2e2f0"/>
      <circle cx="46" cy="94" r="2" fill="#e2e2f0"/>
      <circle cx="35" cy="98" r="2" fill="#e2e2f0"/>
    </g>
  </g>

  <!-- Accent decorative elements -->
  <g opacity="0.15">
    <circle cx="150" cy="150" r="3" fill="#F2A72A"/>
    <circle cx="350" cy="500" r="2" fill="#F2A72A"/>
    <circle cx="680" cy="120" r="2" fill="#F2A72A"/>
    <circle cx="900" cy="550" r="3" fill="#F2A72A"/>
    <circle cx="500" cy="580" r="1.5" fill="#F2A72A"/>
    <circle cx="1050" cy="200" r="2" fill="#F2A72A"/>
    <line x1="150" y1="150" x2="200" y2="150" stroke="#F2A72A" stroke-width="0.5"/>
    <line x1="350" y1="500" x2="380" y2="500" stroke="#F2A72A" stroke-width="0.5"/>
  </g>

  <!-- Title text -->
  <g transform="translate(120, 540)">
    <text x="0" y="0" fill="#e2e2f0" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3">
      PC LENTO
    </text>
    <text x="0" y="24" fill="#9494b8" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="400" letter-spacing="1" opacity="0.7">
      GUÍA PRÁCTICA DE OPTIMIZACIÓN
    </text>
  </g>

  <!-- Amber accent line -->
  <g transform="translate(120, 525)">
    <rect x="0" y="0" width="40" height="3" rx="1.5" fill="#F2A72A"/>
  </g>
</svg>